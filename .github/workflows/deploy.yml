
name: Request Organizer Deploy

on:
  workflow_run:
    workflows: ["CI"]
    types:
      - completed
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: request-organizer-deploy
  cancel-in-progress: false

jobs:
  request-deploy:
    name: Request deployer publish
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (
        github.event.workflow_run.conclusion == 'success' &&
        !contains(github.event.workflow_run.head_commit.message, '[skip deploy]')
      )
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      
      - name: Checkout
        uses: actions/checkout@v4

      - name: Resolve deploy request
        id: request
        env:
          EVENT_NAME: ${{ github.event_name }}
          WORKFLOW_RUN_SHA: ${{ github.event.workflow_run.head_sha }}
          WORKFLOW_RUN_BRANCH: ${{ github.event.workflow_run.head_branch }}
          MANUAL_SHA: ${{ github.sha }}
          MANUAL_BRANCH: ${{ github.ref_name }}
        run: |
          set -euo pipefail

          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            sha="$MANUAL_SHA"
            branch="$MANUAL_BRANCH"
          else
            sha="$WORKFLOW_RUN_SHA"
            branch="$WORKFLOW_RUN_BRANCH"
          fi

          if [ "$branch" != "main" ]; then
            echo "Only main branch deploy requests are allowed. Got: $branch"
            exit 1
          fi

          {
            echo "sha=$sha"
            echo "branch=$branch"
            echo "artifact_name=site-dist-$sha"
          } >> "$GITHUB_OUTPUT"

      - name: Resolve manual CI artifact source
        if: github.event_name == 'workflow_dispatch'
        id: manual_ci
        env:
          GITHUB_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          TARGET_SHA: ${{ steps.request.outputs.sha }}
        run: |
          set -euo pipefail

          python3 - <<'PY' >> "$GITHUB_OUTPUT"
          import json
          import os
          import urllib.parse
          import urllib.request

          repository = os.environ["REPOSITORY"]
          target_sha = os.environ["TARGET_SHA"]
          token = os.environ["GITHUB_TOKEN"]
          query = urllib.parse.urlencode(
              {
                  "branch": "main",
                  "event": "push",
                  "head_sha": target_sha,
                  "status": "success",
                  "per_page": 10,
              }
          )
          url = (
              f"https://api.github.com/repos/{repository}/actions/"
              f"workflows/ci.yml/runs?{query}"
          )
          request = urllib.request.Request(
              url,
              headers={
                  "Accept": "application/vnd.github+json",
                  "Authorization": f"Bearer {token}",
                  "X-GitHub-Api-Version": "2022-11-28",
              },
          )

          with urllib.request.urlopen(request, timeout=30) as response:
              payload = json.load(response)

          matching_runs = [
              run
              for run in payload.get("workflow_runs", [])
              if run.get("head_sha") == target_sha
              and run.get("event") == "push"
              and run.get("conclusion") == "success"
          ]

          if not matching_runs:
              raise SystemExit(
                  f"No successful CI push run found for commit {target_sha}."
              )

          print(f"source_run_id={matching_runs[0]['id']}")
          PY

      - name: Select CI source run
        id: source
        env:
          EVENT_NAME: ${{ github.event_name }}
          AUTOMATIC_CI_RUN_ID: ${{ github.event.workflow_run.id }}
          MANUAL_CI_RUN_ID: ${{ steps.manual_ci.outputs.source_run_id }}
        run: |
          set -euo pipefail

          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            source_run_id="$MANUAL_CI_RUN_ID"
          else
            source_run_id="$AUTOMATIC_CI_RUN_ID"
          fi

          if [ -z "$source_run_id" ]; then
            echo "Unable to resolve the CI run that produced the artifact."
            exit 1
          fi

          echo "source_run_id=$source_run_id" >> "$GITHUB_OUTPUT"

      - name: Download CI dist artifact
        uses: actions/download-artifact@v4
        with:
          name: ${{ steps.request.outputs.artifact_name }}
          path: ./release-candidate/dist
          run-id: ${{ steps.source.outputs.source_run_id }}
          github-token: ${{ github.token }}

      - name: Record artifact identity
        run: |
          set -euo pipefail

          mkdir -p release-candidate
          printf '{"tasks":["T03","T17"],"artifact":"%s","sha":"%s","source_run_id":"%s","deployment_strategy":"health-gated-symlink","health_path":"/health/","release_script":"scripts/deploy-health-gated-release.sh"}\n' \
            "${{ steps.request.outputs.artifact_name }}" \
            "${{ steps.request.outputs.sha }}" \
            "${{ steps.source.outputs.source_run_id }}" \
            > release-candidate/artifact-manifest.json

      - name: Upload deploy evidence
        uses: actions/upload-artifact@v4
        with:
          name: deploy-evidence-${{ steps.request.outputs.sha }}
          path: release-candidate/artifact-manifest.json

      - name: Request deploy from organizer deployer
        env:
          DEPLOYER_DISPATCH_TOKEN: ${{ secrets.DEPLOYER_DISPATCH_TOKEN }}
          DEPLOYER_REPO: knurdz/deploy-sprint-deployer
          TEAM_REPO: ${{ github.repository }}
          TEAM_SHA: ${{ steps.request.outputs.sha }}
          TEAM_BRANCH: ${{ steps.request.outputs.branch }}
          SOURCE_RUN_ID: ${{ steps.source.outputs.source_run_id }}
        run: |
          set -euo pipefail

          if [ -z "$DEPLOYER_DISPATCH_TOKEN" ]; then
            echo "DEPLOYER_DISPATCH_TOKEN is not configured."
            exit 1
          fi

          python3 - <<'PY' > payload.json
          import json
          import os

          payload = {
              "event_type": "team-falcon-code-main-merged",
              "client_payload": {
                  "team": "falcon-code",
                  "repo": os.environ["TEAM_REPO"],
                  "sha": os.environ["TEAM_SHA"],
                  "branch": os.environ["TEAM_BRANCH"],
                  "source_run_id": os.environ["SOURCE_RUN_ID"],
                  "deployment_strategy": "health-gated-symlink",
                  "health_path": "/health/",
                  "release_script": "scripts/deploy-health-gated-release.sh",
              },
          }

          print(json.dumps(payload))
          PY

          curl --fail-with-body --show-error --silent \
            -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer ${DEPLOYER_DISPATCH_TOKEN}" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${DEPLOYER_REPO}/dispatches" \
            --data @payload.json

          echo "Requested organizer deployment for ${TEAM_REPO}@${TEAM_SHA}."

      - name: Generate Resend deployment alert evidence
        env:
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          RESEND_SEND_EMAIL: ${{ vars.RESEND_SEND_EMAIL || 'false' }}
          RESEND_COMMIT: ${{ steps.request.outputs.sha }}
          RESEND_EVIDENCE_PATH: release-candidate/resend-email-evidence.json
        run: node team-site/scripts/send-resend-alert.mjs

      - name: Record Resend alert summary
        run: cat release-candidate/resend-email-evidence.json >> "$GITHUB_STEP_SUMMARY"

      - name: Upload Resend alert evidence
        uses: actions/upload-artifact@v4
        with:
          name: resend-email-evidence-${{ steps.request.outputs.sha }}
          path: release-candidate/resend-email-evidence.json
          if-no-files-found: error
