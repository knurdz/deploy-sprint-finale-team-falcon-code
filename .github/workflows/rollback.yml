name: Manual Rollback

on:
  workflow_dispatch:
    inputs:
      release_ref:
        description: Known-good tag, SHA, or artifact id
        required: true

permissions:
  contents: read

jobs:
  rollback:
    name: Redeploy known-good release
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout release target
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.release_ref }}
          fetch-depth: 0

      - name: Resolve rollback target & verify SHA
        id: resolve
        run: |
          set -euo pipefail
          echo "T04 rollback requested"
          test -n "${{ inputs.release_ref }}"
          
          RESOLVED_SHA=$(git rev-parse HEAD)
          echo "Resolved target commit: $RESOLVED_SHA"
          echo "sha=$RESOLVED_SHA" >> "$GITHUB_OUTPUT"
          
          echo "### 🔄 Manual Rollback Execution" >> "$GITHUB_STEP_SUMMARY"
          echo "- **Requested Release Ref:** \`${{ inputs.release_ref }}\`" >> "$GITHUB_STEP_SUMMARY"
          echo "- **Resolved Commit SHA:** \`$RESOLVED_SHA\`" >> "$GITHUB_STEP_SUMMARY"
          echo "- **Workflow Run ID:** \`${{ github.run_id }}\`" >> "$GITHUB_STEP_SUMMARY"

      - name: Request rollback deploy from organizer deployer
        env:
          DEPLOYER_DISPATCH_TOKEN: ${{ secrets.DEPLOYER_DISPATCH_TOKEN }}
          DEPLOYER_REPO: knurdz/deploy-sprint-deployer
          TEAM_REPO: ${{ github.repository }}
          TEAM_SHA: ${{ steps.resolve.outputs.sha }}
          TEAM_BRANCH: main
          SOURCE_RUN_ID: ${{ github.run_id }}
        run: |
          set -euo pipefail

          if [ -z "$DEPLOYER_DISPATCH_TOKEN" ]; then
            echo "DEPLOYER_DISPATCH_TOKEN is not configured. Performing dry-run."
            echo "Dry-run rollback deployment requested for ${TEAM_REPO}@${TEAM_SHA} (release_ref=${{ inputs.release_ref }})."
            echo "- **Deployment Status:** Dry-run (DEPLOYER_DISPATCH_TOKEN unconfigured in this context)" >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          python3 - <<'PY' > payload.json
          import json
          import os

          payload = {
              "event_type": "team-falcon-code-main-merged",
              "client_payload": {
                  "team": "falcon-code",
                  "repo": os.environ["TEAM_REPO"],
                  "sha": os.environ["TEAM_SHA"],
                  "branch": os.environ["TEAM_BRANCH"],
                  "source_run_id": os.environ["SOURCE_RUN_ID"],
              },
          }

          print(json.dumps(payload))
          PY

          curl --fail-with-body --show-error --silent \
            -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer ${DEPLOYER_DISPATCH_TOKEN}" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${DEPLOYER_REPO}/dispatches" \
            --data @payload.json

          echo "Requested organizer rollback deployment for ${TEAM_REPO}@${TEAM_SHA} (release_ref=${{ inputs.release_ref }})."
          echo "- **Deployment Status:** Successfully dispatched rollback request to organizer deployer" >> "$GITHUB_STEP_SUMMARY"
