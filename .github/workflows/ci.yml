name: CI


on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    name: Build and upload dist
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Rehearse T17 health-gated release switch
        run: |
          set -euo pipefail
          bash scripts/test-health-gated-release.sh 2>&1 | tee t17-release-rehearsal.log
          {
            echo "## T17 Health-Gated Release Rehearsal"
            echo
            echo '```text'
            cat t17-release-rehearsal.log
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload T17 release rehearsal evidence
        uses: actions/upload-artifact@v4
        with:
          name: t17-health-gate-${{ github.sha }}
          path: t17-release-rehearsal.log
          if-no-files-found: error
          retention-days: 7

      - name: Setup Node with lockfile cache
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: team-site/package-lock.json

      - name: Record dependency cache evidence
        run: |
          {
            echo "## T12 Dependency Cache"
            echo
            echo "- Cache provider: \`actions/setup-node@v4\`"
            echo "- Package manager: \`npm\`"
            echo "- Cache dependency path: \`team-site/package-lock.json\`"
            echo "- Deterministic install: \`npm ci\`"
            echo "- Source commit: \`${GITHUB_SHA}\`"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Install dependencies
        run: npm ci
        working-directory: team-site

      - name: Build
        env:
        
          FEATURE_SHOW_INSIGHTS: ${{ secrets.FEATURE_FLAG_NAME }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          OPENWEATHER_API_KEY: ${{ secrets.OPENWEATHER_API_KEY }}
          OPENWEATHER_CITY: Colombo
          WEB3FORMS_ACCESS_KEY: ${{ secrets.WEB3FORMS_ACCESS_KEY }}
          WEB3FORMS_TARGET_EMAIL: judges@knurdz.org
          VITE_PUBLIC_URL: ${{ vars.PUBLIC_URL || vars.DOMAIN_PUBLIC_URL || secrets.PUBLIC_URL || vars.IP_PUBLIC_URL }}
          PUBLIC_URL: ${{ vars.PUBLIC_URL || vars.DOMAIN_PUBLIC_URL || vars.IP_PUBLIC_URL }}
        run: npm run build
        working-directory: team-site

      - name: Upload dist artifact
        uses: actions/upload-artifact@v4
        with:
          name: site-dist-${{ github.sha }}
          path: team-site/dist
          if-no-files-found: error
          retention-days: 7

  container:
    name: Build and verify T18 container
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      IMAGE_TAG: deploy-sprint/team-site:${{ github.sha }}
      CONTAINER_NAME: t18-team-site
      TEST_PORT: "18080"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build commit-tagged container image
        env:
          PUBLIC_URL: ${{ vars.PUBLIC_URL || vars.DOMAIN_PUBLIC_URL || vars.IP_PUBLIC_URL }}
        run: |
          set -euo pipefail
          mkdir -p container-evidence
          docker build \
            --build-arg "COMMIT_SHA=${GITHUB_SHA}" \
            --build-arg "RELEASE_ID=${GITHUB_RUN_ID}" \
            --build-arg "PUBLIC_URL=${PUBLIC_URL:-not-configured}" \
            --tag "$IMAGE_TAG" \
            team-site \
            2>&1 | tee container-evidence/docker-build.log

      - name: Run container and verify health
        run: |
          set -euo pipefail

          container_id="$(
            docker run --detach \
              --name "$CONTAINER_NAME" \
              --publish "127.0.0.1:${TEST_PORT}:8080" \
              "$IMAGE_TAG"
          )"

          cleanup() {
            docker logs "$CONTAINER_NAME" > container-evidence/container.log 2>&1 || true
            docker rm --force "$CONTAINER_NAME" >/dev/null 2>&1 || true
          }
          trap cleanup EXIT

          health_url="http://127.0.0.1:${TEST_PORT}/health/"
          for attempt in {1..20}; do
            if health_body="$(curl --fail --silent --show-error "$health_url")"; then
              break
            fi
            if [ "$attempt" -eq 20 ]; then
              echo "T18 container did not become healthy."
              docker logs "$CONTAINER_NAME"
              exit 1
            fi
            sleep 1
          done

          if [ "$health_body" != "ok" ]; then
            echo "T18 unexpected health response: $health_body"
            exit 1
          fi

          curl --fail --silent --show-error \
            "http://127.0.0.1:${TEST_PORT}/status/" \
            > container-evidence/status.json

          grep --fixed-strings --quiet "$GITHUB_SHA" container-evidence/status.json

          image_id="$(docker image inspect --format '{{.Id}}' "$IMAGE_TAG")"
          export CONTAINER_ID="$container_id" IMAGE_ID="$image_id"
          python3 - <<'PY' > container-evidence/container-manifest.json
          import json
          import os

          print(json.dumps({
              "task": "T18",
              "commit": os.environ["GITHUB_SHA"],
              "image": os.environ["IMAGE_TAG"],
              "image_id": os.environ["IMAGE_ID"],
              "container_id": os.environ["CONTAINER_ID"],
              "container_port": 8080,
              "health_path": "/health/",
              "health": "passed",
          }, indent=2))
          PY

          {
            echo "## T18 Container Evidence"
            echo
            echo "- Commit: \`${GITHUB_SHA}\`"
            echo "- Image: \`${IMAGE_TAG}\`"
            echo "- Image ID: \`${image_id}\`"
            echo "- Container port: \`8080\`"
            echo "- Candidate health: passed before deploy request"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Save immutable container image
        run: |
          set -euo pipefail
          docker save "$IMAGE_TAG" | gzip -9 > container-evidence/team-site-image.tar.gz

      - name: Upload T18 container evidence
        uses: actions/upload-artifact@v4
        with:
          name: container-image-${{ github.sha }}
          path: container-evidence
          if-no-files-found: error
          retention-days: 7
