name: falcon-code-runtime

services:
  team-site:
    image: deploy-sprint/team-site:${APP_VERSION}
    restart: unless-stopped
    ports:
      - "${APP_PORT}:8080"
    env_file:
      - .env
    environment:
      PUBLIC_URL: ${PUBLIC_URL}
    healthcheck:
      test: [ "CMD", "wget", "-qO-", "http://127.0.0.1:8080/health/" ]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 5s
